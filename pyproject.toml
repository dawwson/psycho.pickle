[project]
name = "psycho-pickle"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.31.0",
    "boto3>=1.39.0",
    "fastapi>=0.135.1",
    "langchain-openai>=0.1.0",
    "langchain>=0.2.0",
    "openai>=2.26.0",
    "pydantic-settings>=2.13.1",
    "sqlalchemy>=2.0.48",
    "uvicorn[standard]>=0.41.0",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.21.0",
    "basedpyright>=1.38.2",
    "greenlet>=3.1.1",
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.0.0",
    "ruff>=0.15.6",
]

[tool.pytest.ini_options]
# pytest가 async test와 async fixture를 asyncio event loop에서 실행한다.
asyncio_mode = "auto"
pythonpath = ["."]
